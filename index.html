<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Indak - Ilonggo Rhythm Game</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2D1B69">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS 2026 Specifics -->
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <meta name="apple-mobile-web-app-title" content="Indak">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Main Game Container -->
        <header class="safe-area">
            <h1>Indak</h1>
            <div id="header-right">
                <button id="exit-btn" class="hidden"
                    style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 12px; border-radius: 8px; color: white; font-size: 0.8rem; font-weight: bold; cursor: pointer;">EXIT</button>
                <div id="status-display"></div>
            </div>
        </header>

        <main id="game-canvas">
            <!-- Rhythm game elements will be injected here -->
            <div class="hero-section">
                <div class="glass-card">
                    <h2>Sugod na kita!</h2>
                    <p class="hero-desc">Master Hiligaynon heart and soul.</p>

                    <div class="instructions">
                        <ul>
                            <li><strong>Tap</strong> when the shrinking ring exactly hits the syllable card.</li>
                            <li>Read the word left-to-right as you tap to learn the pronunciation!</li>
                            <li>Get a <strong>PERFECT</strong> flow to reveal the English meaning!</li>
                        </ul>
                    </div>

                    <div class="speed-selector">
                        <label class="speed-option">
                            <input type="radio" name="game-speed" value="slow" checked>
                            <span>Learner (Slow)</span>
                        </label>
                        <label class="speed-option">
                            <input type="radio" name="game-speed" value="fast">
                            <span>Native (Fast)</span>
                        </label>
                        <div class="game-modes"
                            style="display: flex; flex-direction: column; gap: 1rem; width: 100%; margin-top: 1rem;">
                            <button id="start-btn" class="btn-primary">START INDAK (Rhythm)</button>
                            <button id="start-swipe-btn" class="btn-secondary"
                                style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 1rem; border-radius: 12px; color: white; font-weight: bold; font-size: 1.1rem;">Swipe
                                Sorter</button>
                            <button id="start-sentence-btn" class="btn-secondary"
                                style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 1rem; border-radius: 12px; color: white; font-weight: bold; font-size: 1.1rem;">Sentence
                                Builder</button>
                        </div>
                    </div>
                </div>
        </main>

        <!-- Summary Screen -->
        <div id="summary-screen" class="hidden"></div>

        <!-- Install Prompt Component -->
        <div id="install-ui" class="hidden"></div>
    </div>

    <script src="install-prompt.js"></script>
    <script src="main.js" type="module"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.error('SW Registration failed', err));
            });
        }
    </script>
</body>

</html>
