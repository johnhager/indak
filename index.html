<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Indak - Ilonggo Rhythm Game</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2D1B69">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS 2026 Specifics -->
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <meta name="apple-mobile-web-app-title" content="Indak">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Main Game Container -->
        <header class="safe-area">
            <h1>Indak</h1>
            <div id="status-display"></div>
        </header>

        <main id="game-canvas">
            <!-- Rhythm game elements will be injected here -->
            <div class="hero-section">
                <div class="glass-card">
                    <h2>Sugod na kita.</h2>
                    <p>Experience the rhythm of Hiligaynon.</p>
                    <button id="start-btn" class="btn-primary">START GAME</button>
                </div>
            </div>
        </main>

        <!-- Summary Screen -->
        <div id="summary-screen" class="hidden"></div>

        <!-- Install Prompt Component -->
        <div id="install-ui" class="hidden"></div>
    </div>

    <script src="install-prompt.js"></script>
    <script src="main.js" type="module"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.error('SW Registration failed', err));
            });
        }
    </script>
</body>

</html>
